
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardTab</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>⭐</text></svg>">
    <style>
    /* ============================================================
       CardTab 主题 —— 美化版
       设计基调：柔和玻璃拟态 + 呼吸感光斑背景 + 渐变品牌色
       字体整体放大，保证舒适阅读；暗色/亮色通过 CSS 变量切换
       ============================================================ */

    /* ---------- 设计变量 ---------- */
    body {
        --bg: #f2f6f3;
        --bg-glow-1: rgba(67, 184, 131, 0.18);
        --bg-glow-2: rgba(93, 127, 185, 0.16);
        --bg-glow-3: rgba(255, 190, 120, 0.14);
        --panel: rgba(255, 255, 255, 0.72);
        --panel-solid: #ffffff;
        --panel-border: rgba(255, 255, 255, 0.7);
        --line: rgba(31, 41, 55, 0.09);
        --text: #26334a;
        --text-2: #5d6b7e;
        --text-3: #8b96a6;
        --brand: #2fae7d;
        --brand-deep: #279a6b;
        --brand-soft: rgba(47, 174, 125, 0.15);
        --brand-grad: linear-gradient(135deg, #38c98c 0%, #2fae7d 55%, #28a39a 100%);
        --accent: #5d7fb9;
        --accent-soft: rgba(93, 127, 185, 0.15);
        --danger: #e74c3c;
        --warn: #ff9800;
        --shadow-sm: 0 2px 10px rgba(31, 45, 61, 0.06);
        --shadow-md: 0 10px 30px rgba(31, 45, 61, 0.11);
        --shadow-lg: 0 18px 50px rgba(31, 45, 61, 0.17);
        --radius-sm: 10px;
        --radius: 14px;
        --radius-lg: 20px;
        --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color-scheme: light;
    }

    body.dark-theme {
        --bg: #0d1117;
        --bg-glow-1: rgba(67, 184, 131, 0.10);
        --bg-glow-2: rgba(93, 127, 185, 0.13);
        --bg-glow-3: rgba(124, 92, 186, 0.11);
        --panel: rgba(24, 29, 40, 0.78);
        --panel-solid: #1a2029;
        --panel-border: rgba(255, 255, 255, 0.09);
        --line: rgba(255, 255, 255, 0.08);
        --text: #e7ecf4;
        --text-2: #9fb0c3;
        --text-3: #6c7a8d;
        --brand: #5d7fb9;
        --brand-deep: #4a6fa5;
        --brand-soft: rgba(93, 127, 185, 0.16);
        --brand-grad: linear-gradient(135deg, #7298d6 0%, #5d7fb9 55%, #4a6fa5 100%);
        --accent: #43b883;
        --accent-soft: rgba(67, 184, 131, 0.15);
        --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.28);
        --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.38);
        --shadow-lg: 0 18px 50px rgba(0, 0, 0, 0.5);
        color-scheme: dark;
    }

    /* ---------- 基础与呼吸感背景 ---------- */
    * {
        box-sizing: border-box;
    }

    html,
    body {
        min-height: 100%;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: var(--font);
        font-size: 17px;
        line-height: 1.6;
        color: var(--text);
        background-color: var(--bg);
        background-image:
            radial-gradient(1100px 700px at 88% -12%, var(--bg-glow-2), transparent 60%),
            radial-gradient(950px 650px at -12% 22%, var(--bg-glow-1), transparent 55%),
            radial-gradient(900px 700px at 50% 125%, var(--bg-glow-3), transparent 60%);
        background-attachment: fixed;
        transition: background-color 0.4s ease, color 0.4s ease;
        -webkit-font-smoothing: antialiased;
    }

    /* 缓慢漂移的装饰光斑，赋予页面生命力 */
    body::before,
    body::after {
        content: '';
        position: fixed;
        z-index: -1;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.5;
        pointer-events: none;
        will-change: transform;
    }

    body::before {
        width: 520px;
        height: 520px;
        top: -140px;
        left: -120px;
        background: var(--bg-glow-1);
        animation: aurora-a 26s ease-in-out infinite alternate;
    }

    body::after {
        width: 620px;
        height: 620px;
        right: -160px;
        bottom: -160px;
        background: var(--bg-glow-2);
        animation: aurora-b 32s ease-in-out infinite alternate;
    }

    @keyframes aurora-a {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(80px, 60px) scale(1.15); }
        100% { transform: translate(20px, 120px) scale(0.95); }
    }

    @keyframes aurora-b {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(-90px, -50px) scale(1.1); }
        100% { transform: translate(-30px, -100px) scale(1.22); }
    }

    ::selection {
        background: var(--brand-soft);
        color: var(--text);
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
    }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background: var(--brand);
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: var(--brand-deep);
        border: 2px solid transparent;
        background-clip: padding-box;
    }

    /* ---------- 顶部固定区域 ---------- */
    .fixed-elements {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        min-height: 158px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 64px 8px;
        background: var(--panel);
        backdrop-filter: blur(18px) saturate(1.4);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        border-bottom: 1px solid var(--panel-border);
        box-shadow: var(--shadow-sm);
        transition: background-color 0.4s ease;
    }

    /* 站点标题 */
    .fixed-elements h3 {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--text);
        z-index: 10;
    }

    .site-title .brand {
        display: inline-flex;
        align-items: center;
        font-size: 26px;
    }

    .site-title .brand::before {
        content: '';
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--brand-grad);
        margin-right: 10px;
        animation: brandPulse 3s ease-in-out infinite;
    }

    @keyframes brandPulse {
        0%, 100% { box-shadow: 0 0 6px var(--brand); }
        50%      { box-shadow: 0 0 18px var(--brand); }
    }

    /* 中心内容 */
    .center-content {
        width: 100%;
        text-align: center;
        padding: 0 10px;
    }

    /* 搜索栏 */
    .search-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    .search-bar {
        display: flex;
        width: 100%;
        max-width: 640px;
        margin: 0 auto 12px;
        border-radius: 999px;
        overflow: hidden;
        background: var(--panel);
        border: 1.5px solid var(--panel-border);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        transition: all 0.3s ease;
    }

    .search-bar:focus-within {
        border-color: var(--brand);
        box-shadow: 0 0 0 4px var(--brand-soft), var(--shadow-md);
        transform: translateY(-1px);
    }

    .search-bar select {
        border: none;
        background-color: transparent;
        padding: 12px 34px 12px 18px;
        font-size: 16px;
        font-weight: 600;
        color: var(--brand);
        width: 128px;
        outline: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path fill="%232fae7d" d="M0 0l6 6 6-6z"/></svg>');
        background-repeat: no-repeat;
        background-position: right 14px center;
        border-right: 1px solid var(--line);
        cursor: pointer;
        transition: all 0.3s ease;
    }

    body.dark-theme .search-bar select {
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path fill="%235d7fb9" d="M0 0l6 6 6-6z"/></svg>');
    }

    .search-bar input {
        flex: 1;
        min-width: 0;
        border: none;
        padding: 12px 18px;
        font-size: 16px;
        background-color: transparent;
        color: var(--text);
        outline: none;
    }

    .search-bar input::placeholder {
        color: var(--text-3);
    }

    .search-bar button {
        border: none;
        background: var(--brand-grad);
        color: #fff;
        padding: 0 26px;
        font-size: 18px;
        cursor: pointer;
        transition: filter 0.3s ease, transform 0.2s ease;
    }

    .search-bar button:hover {
        filter: brightness(1.08);
    }

    .search-bar button:active {
        transform: scale(0.96);
    }

    select option {
        background-color: var(--panel-solid);
        color: var(--text);
        padding: 8px;
        font-size: 15px;
        white-space: nowrap;
    }

    /* 分类快捷按钮 */
    .category-buttons-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        padding: 4px 12px 0;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
    }


    .category-button {
        padding: 7px 16px;
        border-radius: 999px;
        background: var(--panel);
        color: var(--brand);
        border: 1.5px solid transparent;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.3px;
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: all 0.25s ease;
        flex: 0 0 auto;
        white-space: nowrap;
        position: relative;
    }

    .category-button:hover {
        background: var(--brand);
        color: #fff;
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
    }

    .category-button.active {
        background: var(--brand-grad);
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 0 0 3px var(--brand-soft), 0 8px 22px var(--brand-soft);
        border-color: var(--brand);
        font-weight: 700;
    }

    /* ---------- 右上角控制区 ---------- */
    .top-right-controls {
        position: fixed;
        top: 16px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 1001;
    }

    .admin-btn,
    .login-btn {
        border: none;
        border-radius: 999px;
        padding: 10px 22px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
        background: var(--brand-grad);
        box-shadow: 0 6px 16px var(--brand-soft);
        transition: all 0.25s ease;
    }

    .admin-btn:hover,
    .login-btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.06);
        box-shadow: var(--shadow-md);
    }

    .admin-btn:active,
    .login-btn:active {
        transform: translateY(0) scale(0.97);
    }

    /* 书签搜索按钮 */
    .bookmark-search-toggle {
        position: relative;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--brand-grad);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 6px 16px var(--brand-soft);
        transition: all 0.25s ease;
    }

    .bookmark-search-toggle:hover {
        transform: translateY(-2px) rotate(6deg);
        box-shadow: var(--shadow-md);
    }

    .bookmark-search-toggle svg {
        width: 21px;
        height: 21px;
        stroke: currentColor;
    }

    .bookmark-search-dropdown {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        width: 220px;
        background: var(--panel-solid);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        padding: 8px;
        display: none;
        z-index: 1002;
    }

    .bookmark-search-dropdown.show {
        display: block;
        animation: popIn 0.2s ease;
    }

    .bookmark-search-dropdown input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 15px;
        background-color: transparent;
        color: var(--text);
        outline: none;
        box-sizing: border-box;
        transition: all 0.25s ease;
    }

    .bookmark-search-dropdown input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-soft);
    }

    .bookmark-search-dropdown input::placeholder {
        color: var(--text-3);
    }

    /* ---------- 主要内容区 ---------- */
    .content {
        margin-top: 230px;
        padding: 16px 10px 60px;
        max-width: 1600px;
        margin-left: auto;
        margin-right: auto;
        transition: opacity 0.3s ease;
    }

    .loading .content {
        opacity: 0.6;
    }

    /* 管理控制按钮（管理员可见） */
    .add-remove-controls {
        display: none;
        flex-direction: column;
        position: fixed;
        right: 22px;
        top: 50%;
        transform: translateY(-50%);
        align-items: center;
        gap: 14px;
        z-index: 900;
    }

    .round-btn {
        background: var(--brand-grad);
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: var(--shadow-md);
        transition: all 0.25s ease;
    }

    .round-btn svg {
        pointer-events: none;
        display: block;
        margin: auto;
        width: 24px;
        height: 24px;
    }

    .round-btn:hover {
        transform: translateY(-3px) scale(1.06);
        box-shadow: var(--shadow-lg);
    }

    .round-btn:active {
        transform: translateY(0) scale(0.95);
    }

    .add-btn { order: 1; }
    .remove-btn { order: 2; }
    .category-add-btn { order: 3; }
    .category-manage-btn { order: 4; }

    /* ---------- 分类与卡片 ---------- */
    .section {
        margin-bottom: 32px;
        padding: 0 15px;
    }

    .section-title-container {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
        transition: border-color 0.3s ease;
        width: 100%;
        max-width: 1520px;
        margin-left: auto;
        margin-right: auto;
    }

    .section-title {
        font-size: 24px;
        font-weight: 700;
        color: var(--text);
        position: relative;
        padding-left: 16px;
        letter-spacing: 0.5px;
        transition: color 0.3s ease;
        min-width: 120px;
    }

    .section-title::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 5px;
        height: 26px;
        border-radius: 3px;
        background: var(--brand-grad);
        box-shadow: 0 0 10px var(--brand-soft);
    }

    /* 分类管理按钮 */
    .edit-category-btn,
    .move-category-btn {
        background: var(--brand);
        color: #fff;
        border: none;
        padding: 5px 12px;
        margin-left: 8px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: none;
    }

    .edit-category-btn:hover {
        filter: brightness(1.1);
    }

    .move-category-btn {
        background: var(--accent);
        padding: 5px 10px;
        min-width: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .move-category-btn:hover {
        filter: brightness(1.1);
    }

    .move-category-btn svg {
        width: 16px;
        height: 16px;
        fill: #fff;
    }

    .delete-category-btn {
        background: var(--danger);
        color: #fff;
        border: none;
        padding: 5px 12px;
        margin-left: 8px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: none;
    }

    .delete-category-btn:hover {
        filter: brightness(1.1);
    }

    /* 卡片网格 */
    .card-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, 216px);
        column-gap: 26px;
        row-gap: 20px;
        justify-content: start;
        padding: 10px 15px 10px 30px;
        margin: 0 auto;
        max-width: 1600px;
    }

    /* 卡片 */
    .card {
        position: relative;
        width: 216px;
        padding: 18px 16px 16px;
        border-radius: var(--radius);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-left: 4px solid var(--brand);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        user-select: none;
        margin: 2px;
        overflow: hidden;
        animation: cardIn 0.45s ease forwards;
        animation-delay: calc(var(--card-index) * 0.05s);
        opacity: 0;
        transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease, background-color 0.28s ease;
    }

    /* 悬停光泽扫过 */
    .card::after {
        content: '';
        position: absolute;
        top: 0;
        left: -80%;
        width: 50%;
        height: 100%;
        background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.32), transparent);
        transform: skewX(-20deg);
        transition: left 0.5s ease;
        pointer-events: none;
    }

    .card:hover::after {
        left: 140%;
    }

    .card:hover {
        transform: translateY(-6px);
        border-color: var(--brand);
        box-shadow: var(--shadow-md);
    }

    @keyframes cardIn {
        from { opacity: 0; transform: translateY(18px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card.dragging {
        opacity: 0.85;
        transform: scale(1.05) rotate(2deg);
        box-shadow: var(--shadow-lg);
        border-style: dashed;
    }

    .card.no-hover:hover {
        transform: none !important;
        box-shadow: var(--shadow-sm) !important;
    }

    .card-top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
    }

    .card-icon {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        object-fit: cover;
        flex-shrink: 0;
        transition: transform 0.25s ease;
    }

    .card:hover .card-icon {
        transform: scale(1.12) rotate(-3deg);
    }

    .card-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        transition: color 0.3s ease;
    }

    .card-url {
        font-size: 14px;
        color: var(--text-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.3s ease;
    }

    .private-tag {
        background: var(--warn);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        padding: 2px 8px;
        border-radius: 999px;
        position: absolute;
        top: 14px;
        right: 10px;
        z-index: 5;
    }

    /* 卡片操作按钮 */
    .card-actions {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        z-index: 15;
    }

    .card-btn {
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 50%;
        color: #fff;
        font-size: 12px;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0;
        box-shadow: var(--shadow-sm);
        transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
        flex-shrink: 0;
    }

    .card-btn:hover {
        transform: translateY(-2px) scale(1.08);
        box-shadow: var(--shadow-md);
        filter: brightness(1.1);
    }

    .card-btn svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        display: block;
        margin: auto;
    }

    .edit-btn {
        background: var(--brand);
    }

    .delete-btn {
        background: var(--danger);
    }

    /* ---------- 浮动按钮组 ---------- */
    .floating-button-group {
        position: fixed;
        bottom: 56px;
        right: 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        z-index: 1000;
    }

    .floating-button-group button {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--brand-grad);
        color: #fff;
        border: none;
        cursor: pointer;
        box-shadow: var(--shadow-md);
        transition: all 0.25s ease;
    }

    .floating-button-group button:hover {
        transform: translateY(-3px) scale(1.05);
        box-shadow: var(--shadow-lg);
    }

    .floating-button-group button:active {

    /* ---------- 全屏登录弹窗 ---------- */

    /* 降低动效偏好 */
    @media (prefers-reduced-motion: reduce) {

        *::after {

<body>
    <!-- 顶部固定区域 -->

                    <circle cx="24" cy="28" r="4" stroke="white" stroke-width="4" fill="none"/>

    <script>
    // 搜索引擎配置
    const searchEngines = {
        baidu: "https://www.baidu.com/s?wd=",
        bing: "https://www.bing.com/search?q="
    };

    let currentEngine = "baidu";

    // 日志记录函数
    function logAction(action, details) {
        const timestamp = new Date().toISOString();
        const logEntry = timestamp + ': ' + action + ' - ' + JSON.stringify(details);
        console.log(logEntry);
    }

    // 设置当前搜索引擎
    function setActiveEngine(engine) {
        currentEngine = engine;
        document.getElementById('search-engine-select').value = engine;
        logAction('设置搜索引擎', { engine });
    }

    // 搜索引擎选择框变更事件
    document.getElementById('search-engine-select').addEventListener('change', function() {
        setActiveEngine(this.value);
    });

    // 搜索按钮点击事件
    document.getElementById('search-button').addEventListener('click', () => {
        const query = document.getElementById('search-input').value;
        if (query) {
            logAction('执行搜索', { engine: currentEngine, query });
            window.open(searchEngines[currentEngine] + encodeURIComponent(query), '_blank');
        }
    });

    // 搜索输入框回车事件
    document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('search-button').click();
        }
    });

    // 初始化搜索引擎
    setActiveEngine(currentEngine);

    // 全局变量
    let publicLinks = [];
    let privateLinks = [];
    let isAdmin = false;
    let isLoggedIn = false;
    let removeMode = false;
    let isEditCategoryMode = false;
    let isDarkTheme = false;
    let links = [];
    const categories = {};

    // 添加新分类
    async function addCategory() {
        if (!await validateToken()) {
            return;
        }
        const categoryName = await showCategoryDialog('请输入新分类名称');
        if (categoryName && !categories[categoryName]) {
            categories[categoryName] = [];
            updateCategorySelect();
            renderSections();
            saveLinks();
            logAction('添加分类', { categoryName, currentLinkCount: links.length });
        } else if (categories[categoryName]) {
            await customAlert('该分类已存在', '添加分类');
            logAction('添加分类失败', { categoryName, reason: '分类已存在' });
        }
    }

    // 删除分类
    async function deleteCategory(category) {
        if (!await validateToken()) {
            return;
        }
        const message = '确定要删除 "' + category + '" 分类吗？这将删除该分类下的所有链接。';
        const confirmed = await customConfirm(message, '确定', '取消');

        if (confirmed) {
            delete categories[category];
            links = links.filter(link => link.category !== category);
            publicLinks = publicLinks.filter(link => link.category !== category);
            privateLinks = privateLinks.filter(link => link.category !== category);
            updateCategorySelect();
            renderSections();
            renderCategoryButtons();
            saveLinks();
            logAction('删除分类', { category });
        }
    }

    // 编辑分类名称
    async function editCategoryName(oldName) {
        if (!await validateToken()) return;

        const newName = await showCategoryDialog('请输入新的分类名称', oldName);
        if (!newName || newName === oldName) return;

        if (categories[newName]) {
            await customAlert('该名称已存在，请重新命名', '编辑分类');
            return;
        }

        // 1. 重命名分类对象
        categories[newName] = categories[oldName];
        delete categories[oldName];

        // 2. 更新所有链接的 category 字段
        [...publicLinks, ...privateLinks].forEach(link => {
            if (link.category === oldName) {
                link.category = newName;
            }
        });

        links.forEach(link => {
            if (link.category === oldName) {
                link.category = newName;
            }
        });

        // 3. 保存并刷新
        renderSections();
        renderCategoryButtons();
        updateCategorySelect();
        saveLinks();

        logAction('编辑分类名称', { oldName, newName });
    }

    // 移动分类
    async function moveCategory(categoryName, direction) {
        if (!await validateToken()) {
            return;
        }
        const keys = Object.keys(categories);
        const index = keys.indexOf(categoryName);
        if (index < 0) return;

        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= keys.length) return;

        // 重建一个新顺序的 categories 对象
        const newCategories = {};
        const reordered = [...keys];
        [reordered[index], reordered[newIndex]] = [reordered[newIndex], reordered[index]];
        reordered.forEach(key => {
            newCategories[key] = categories[key];
        });

        // 替换原有 categories 并重渲染
        Object.keys(categories).forEach(k => delete categories[k]);
        Object.assign(categories, newCategories);

        renderSections();
        renderCategoryButtons();
        updateCategorySelect();
        saveLinks();

        logAction('移动分类', { categoryName, direction });
    }

    // 渲染分类快捷按钮
    function renderCategoryButtons() {
        // 如果正在显示搜索结果，不重新渲染分类按钮
        if (isShowingSearchResults) {
            return;
        }

        const buttonsContainer = document.getElementById('category-buttons-container');
        buttonsContainer.innerHTML = '';

        // 只有当有分类时才显示按钮容器
        if (Object.keys(categories).length > 0) {
            // 获取页面上实际显示的分类顺序（只从sections-container中获取，不包括搜索结果）
            const displayedCategories = [];
            document.querySelectorAll('#sections-container .section-title').forEach(titleElement => {
                displayedCategories.push(titleElement.textContent);
            });

            // 创建按钮并添加到容器
            let visibleButtonsCount = 0;
            displayedCategories.forEach(category => {
                // 检查该分类是否有可见的链接
                const visibleLinks = links.filter(function(link) {
                    return link.category === category && (!link.isPrivate || isLoggedIn);
                });

                // 只为有可见链接的分类创建按钮
                if (visibleLinks.length > 0) {
                    const button = document.createElement('button');
                    button.className = 'category-button';
                    button.textContent = category;
                    button.dataset.category = category;
                    button.onclick = () => {
                        // 如果正在显示搜索结果，先隐藏搜索结果
                        if (isShowingSearchResults) {
                            hideSearchResults();
                        }

                        // 清除所有按钮的active类
                        document.querySelectorAll('.category-button').forEach(btn => {
                            btn.classList.remove('active');
                        });
                        // 为当前点击的按钮添加active类
                        button.classList.add('active');
                        scrollToCategory(category);
                    };

                    buttonsContainer.appendChild(button);
                    visibleButtonsCount++;
                }
            });

            // 按顶部固定区实际高度动态避让（分类按钮可能多行）
            const fixedEl = document.querySelector('.fixed-elements');
            const contentEl = document.querySelector('.content');
            if (fixedEl && contentEl) {
                contentEl.style.marginTop = (fixedEl.offsetHeight + 16) + 'px';
            }

            // 显示或隐藏按钮容器
            if (visibleButtonsCount > 0) {
                buttonsContainer.style.display = 'flex';
            } else {
                buttonsContainer.style.display = 'none';
            }

            // 初始时检测当前可见分类并设置相应按钮为活跃状态
            setTimeout(setActiveCategoryButtonByVisibility, 100);
        } else {
            buttonsContainer.style.display = 'none';
        }
    }

    // 根据可见性设置活跃的分类按钮
    function setActiveCategoryButtonByVisibility() {
        // 如果正在显示搜索结果，不更新分类按钮的活跃状态
        if (isShowingSearchResults) {
            return;
        }

        // 获取所有分类区域
        const sections = document.querySelectorAll('.section');
        if (!sections.length) return;

        // 获取视窗高度
        const viewportHeight = window.innerHeight;
        // 计算视窗中心点（以几何中心为准，不额外偏移）
        const viewportCenter = viewportHeight / 2;

        // 找出最接近视窗中心的分类
        let closestSection = null;
        let closestDistance = Infinity;

        sections.forEach(section => {
            const rect = section.getBoundingClientRect();
            // 计算分类区域的中心点
            const sectionCenter = rect.top + rect.height / 2;
            // 计算到视窗中心的距离
            const distance = Math.abs(sectionCenter - viewportCenter);

            if (distance < closestDistance) {
                closestDistance = distance;
                closestSection = section;
            }
        });

        if (closestSection) {
            const cardContainer = closestSection.querySelector('.card-container');
            if (cardContainer && cardContainer.id) {
                const categoryId = cardContainer.id;
                const buttons = document.querySelectorAll('.category-button');

                // 移除所有活跃状态
                buttons.forEach(btn => btn.classList.remove('active'));

                // 为匹配的分类按钮添加活跃状态
                buttons.forEach(btn => {
                    if (btn.dataset.category === categoryId) {
                        btn.classList.add('active');
                    }
                });
            }
        }
    }

    // 添加滚动事件监听器，滚动时更新活跃的分类按钮
    window.addEventListener('scroll', debounce(setActiveCategoryButtonByVisibility, 100));

    // 防抖函数，避免过多的滚动事件处理
    function debounce(func, wait) {
        let timeout;
        return function() {
            const context = this;
            const args = arguments;
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                func.apply(context, args);
            }, wait);
        };
    }

    // 滚动到指定分类
    function scrollToCategory(category) {
        const section = document.getElementById(category);
        if (section) {
            // 计算滚动位置：以顶部固定区实际高度为基准，避免多行分类按钮时遮挡
            const fixedEl = document.querySelector('.fixed-elements');
            let offset = (fixedEl ? fixedEl.offsetHeight : 230) + 80;

            // 检查是否为移动设备
            if (window.innerWidth <= 480) {
                offset = (fixedEl ? fixedEl.offsetHeight : 120) + 24;
            }

            // 滚动到分类位置
            const sectionRect = section.getBoundingClientRect();
            const absoluteTop = window.pageYOffset + sectionRect.top - offset;

            // 使用平滑滚动效果
            window.scrollTo({
                top: absoluteTop,
                behavior: 'smooth'
            });

            logAction('滚动到分类', { category });
        }
    }

    // 读取链接数据
    async function loadLinks() {
        const headers = {
            'Content-Type': 'application/json'
        };

        // 如果已登录，从 localStorage 获取 token 并添加到请求头
        if (isLoggedIn) {
            const token = localStorage.getItem('authToken');
            if (token) {
                headers['Authorization'] = token;
            }
        }

        try {
            const response = await fetch('/api/getLinks?userId=testUser', {
                headers: headers
            });

            if (!response.ok) {
                throw new Error("HTTP error! status: " + response.status);
            }

            const data = await response.json();

            if (data.categories) {
                Object.assign(categories, data.categories);
            }

            publicLinks = data.links ? data.links.filter(link => !link.isPrivate) : [];
            privateLinks = data.links ? data.links.filter(link => link.isPrivate) : [];
            links = isLoggedIn ? [...publicLinks, ...privateLinks] : publicLinks;

            renderSections();
            updateCategorySelect();
            updateUIState();
            logAction('读取链接', {
                publicCount: publicLinks.length,
                privateCount: privateLinks.length,
                isLoggedIn: isLoggedIn,
                hasToken: !!localStorage.getItem('authToken')
            });
        } catch (error) {
            // 🔧 安全修复：避免泄露详细错误信息
            console.error('Failed to load links');
            console.error('加载链接时出错，请刷新页面重试');
        }
    }

    // 从URL中提取域名
    function extractDomain(url) {
        let domain;
        try {
            domain = new URL(url).hostname;
        } catch (e) {
            domain = url;
        }
        return domain;
    }

    // URL验证函数
    function isValidUrl(url) {
        try {
            new URL(url);
            return true;
        } catch {
            return false;
        }
    }

    // URL规范化函数
    function normalizeUrl(url) {
        if (!url || typeof url !== 'string') {
            return url;
        }

        // 去除首尾空格
        url = url.trim();

        // 补全协议（如果缺少）
        if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url;
        }

        try {
            const parsed = new URL(url);

            // 协议小写
            let normalized = parsed.protocol.toLowerCase() + '//';

            // 域名小写
            normalized += parsed.hostname.toLowerCase();

            // 移除默认端口（80 for http, 443 for https）
            if (parsed.port &&
                !((parsed.protocol === 'http:' && parsed.port === '80') ||
                  (parsed.protocol === 'https:' && parsed.port === '443'))) {
                normalized += ':' + parsed.port;
            }

            // 路径保留原样（服务器可能区分大小写）
            // 但移除根路径的单斜杠
            if (parsed.pathname && parsed.pathname !== '/') {
                normalized += parsed.pathname;
            }

            // 保留查询参数
            if (parsed.search) {
                normalized += parsed.search;
            }

            // 不保留 fragment（#hash 部分）

            return normalized;
        } catch {
            // URL 解析失败，返回小写处理后的原始值
            return url.toLowerCase();
        }
    }

    // 创建卡片
    function createCard(link, container) {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('draggable', isAdmin);
        card.dataset.isPrivate = link.isPrivate;
        card.setAttribute('data-url', link.url);

        // 设置卡片动画延迟
        const cardIndex = container.children.length;
        card.style.setProperty('--card-index', cardIndex);

        const cardTop = document.createElement('div');
        cardTop.className = 'card-top';

        // 定义默认的 SVG 图标
        const defaultIconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>' +
        '<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>' +
        '</svg>';

        // 创建图标元素
        const icon = document.createElement('img');
        icon.className = 'card-icon';

        // 使用自定义图标或回退到favicon提取服务
        icon.src = (
            !link.icon ||
            typeof link.icon !== 'string' ||
            !link.icon.trim() ||
            !isValidUrl(link.icon)
        )
            ? 'https://www.faviconextractor.com/favicon/' + extractDomain(link.url)
            : link.icon;

        icon.alt = 'Website Icon';

        // 如果图片加载失败，使用默认的 SVG 图标
        icon.onerror = function() {
            const svgBlob = new Blob([defaultIconSVG], {type: 'image/svg+xml'});
            const svgUrl = URL.createObjectURL(svgBlob);
            this.src = svgUrl;

            this.onload = () => URL.revokeObjectURL(svgUrl);
        };

        const title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = link.name;

        cardTop.appendChild(icon);
        cardTop.appendChild(title);

        const url = document.createElement('div');
        url.className = 'card-url';
        url.textContent = link.url;

        card.appendChild(cardTop);
        card.appendChild(url);

        if (link.isPrivate) {
            const privateTag = document.createElement('div');
            privateTag.className = 'private-tag';
            privateTag.textContent = '私密';
            card.appendChild(privateTag);
        }

        const correctedUrl = link.url.startsWith('http://') || link.url.startsWith('https://') ? link.url : 'http://' + link.url;

        if (!isAdmin) {
            card.addEventListener('click', () => {
                window.open(correctedUrl, '_blank');
                logAction('打开链接', { name: link.name, url: correctedUrl });
            });
        }

        // 创建按钮容器
        const cardActions = document.createElement('div');
        cardActions.className = 'card-actions';

        // 编辑按钮
        const editBtn = document.createElement('button');
        editBtn.className = 'card-btn edit-btn';
        editBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>' +
            '<path d="m18.5 2.5 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>' +
            '</svg>';
        editBtn.title = '编辑';
        editBtn.onclick = function (event) {
            event.stopPropagation();
            showEditDialog(link);
        };

        // 删除按钮
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'card-btn delete-btn';
        deleteBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<polyline points="3,6 5,6 21,6"></polyline>' +
            '<path d="m19,6v14a2,2 0 0,1 -2,2H7a2,2 0 0,1 -2,-2V6m3,0V4a2,2 0 0,1 2,-2h4a2,2 0 0,1 2,2v2"></path>' +
            '<line x1="10" y1="11" x2="10" y2="17"></line>' +
            '<line x1="14" y1="11" x2="14" y2="17"></line>' +
            '</svg>';
        deleteBtn.title = '删除';
        deleteBtn.onclick = function (event) {
            event.stopPropagation();
            removeCard(card);
        };

        cardActions.appendChild(editBtn);
        cardActions.appendChild(deleteBtn);
        card.appendChild(cardActions);

        // 添加鼠标悬停事件处理描述提示
        card.addEventListener('mousemove', (e) => handleTooltipMouseMove(e, link.tips, isAdmin));
        card.addEventListener('mouseleave', handleTooltipMouseLeave);

        card.addEventListener('dragover', dragOver);

    // 保存链接数据
    async function saveLinks() {
        if (isAdmin && !(await validateToken())) {
            return;
        }

        let allLinks = [...publicLinks, ...privateLinks];

        // 懒迁移：保存前规范化所有 URL
        allLinks = allLinks.map(link => ({
            ...link,
            url: normalizeUrl(link.url)
        }));

        try {
            await fetch('/api/saveOrder', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': localStorage.getItem('authToken')
                },
                body: JSON.stringify({
                    userId: 'testUser',
                    links: allLinks,
                    categories: categories
                }),
            });
            logAction('保存链接', { linkCount: allLinks.length, categoryCount: Object.keys(categories).length });
        } catch (error) {
            // 🔧 安全修复：避免泄露详细错误信息
            logAction('保存链接失败', { error: 'Save operation failed' });
            console.error('保存链接失败，请重试');
        }
    }

    // 添加卡片弹窗
    async function addLink() {
        if (!await validateToken()) {
            return;
        }
        const name = document.getElementById('name-input').value.trim();
        const url = document.getElementById('url-input').value.trim();
        const tips = document.getElementById('tips-input').value.trim();
        const icon = document.getElementById('icon-input').value.trim();
        const category = document.getElementById('category-select').value;
        const isPrivate = document.getElementById('private-checkbox').checked;

        // 验证必填字段
        if (!name || !url || !category) {
            let errorMessage = '';
            if (!name && !url) {
                errorMessage = '请输入名称和URL';
            } else if (!name) {
                errorMessage = '请输入名称';
            } else if (!url) {
                errorMessage = '请输入URL';
            }

            await customAlert(errorMessage, '添加卡片');
            if (!name) {
                document.getElementById('name-input').focus();
            } else if (!url) {
                document.getElementById('url-input').focus();
            }
            return;
        }

        // 规范化 URL 并检查是否已存在
        const normalizedUrl = normalizeUrl(url);
        const allLinks = [...publicLinks, ...privateLinks];
        // 预处理：一次性规范化所有 URL（性能优化）
        const existingUrls = new Set(allLinks.map(link => normalizeUrl(link.url)));

        if (existingUrls.has(normalizedUrl)) {
            await customAlert('该URL已存在，请勿重复添加', '添加卡片');
            document.getElementById('url-input').focus();
            return;
        }

        // 存储规范化后的 URL
        const newLink = { name, url: normalizedUrl, tips, icon, category, isPrivate };

        if (isPrivate) {
            privateLinks.push(newLink);
        } else {
            publicLinks.push(newLink);
        }

        links = isLoggedIn ? [...publicLinks, ...privateLinks] : publicLinks;

        if (isAdmin || (isPrivate && isLoggedIn) || !isPrivate) {
            const container = document.getElementById(category);
            if (container) {
                createCard(newLink, container);
            } else {
                categories[category] = [];
                renderSections();
            }
        }

        saveLinks();

        // 清空表单
        document.getElementById('name-input').value = '';
        document.getElementById('url-input').value = '';
        document.getElementById('tips-input').value = '';
        document.getElementById('icon-input').value = '';

    // 拖拽卡片
    let draggedCard = null;
    let touchStartX, touchStartY;

    // 触屏端拖拽卡片
    function touchStart(event) {
        if (!isAdmin) {
            return;
        }
        draggedCard = event.target.closest('.card');
        if (!draggedCard) return;

        event.preventDefault();
        const touch = event.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;

        draggedCard.classList.add('dragging');

        document.addEventListener('touchmove', touchMove, { passive: false });
        document.addEventListener('touchend', touchEnd);

    }

    function touchMove(event) {
        if (!draggedCard) return;
        event.preventDefault();

        const touch = event.touches[0];
        const currentX = touch.clientX;
        const currentY = touch.clientY;

        const deltaX = currentX - touchStartX;
        const deltaY = currentY - touchStartY;
        draggedCard.style.transform = "translate(" + deltaX + "px, " + deltaY + "px)";

        const target = findCardUnderTouch(currentX, currentY);
        if (target && target !== draggedCard) {
            const container = target.parentElement;
            const targetRect = target.getBoundingClientRect();

            if (currentX < targetRect.left + targetRect.width / 2) {
                container.insertBefore(draggedCard, target);
            } else {
                container.insertBefore(draggedCard, target.nextSibling);
            }
        }
    }

    function touchEnd(event) {
        if (!draggedCard) return;

        const card = draggedCard;
        const targetCategory = card.closest('.card-container').id;

        // 🔧 优化：删除冗余验证，拖拽只在管理员模式下可用，saveCardOrder()内部已有验证
        if (isAdmin && card) {
            updateCardCategory(card, targetCategory);
            saveCardOrder().catch(error => {
                console.error('Save failed:', error);
            });
        }
        cleanupDragState();
    }

    function findCardUnderTouch(x, y) {
        const cards = document.querySelectorAll('.card:not(.dragging)');
        return Array.from(cards).find(card => {
            const rect = card.getBoundingClientRect();
            return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
        });
    }

    // PC端拖拽卡片
    function dragStart(event) {
        if (!isAdmin) {
            event.preventDefault();
            return;
        }
        draggedCard = event.target.closest('.card');

        draggedCard.classList.add('dragging');

    function dragOver(event) {
        if (!isAdmin) {
            event.preventDefault();
            return;
        }
        event.preventDefault();
        const target = event.target.closest('.card');
        if (target && target !== draggedCard) {
            const container = target.parentElement;
            const mousePositionX = event.clientX;
            const targetRect = target.getBoundingClientRect();

            if (mousePositionX < targetRect.left + targetRect.width / 2) {
                container.insertBefore(draggedCard, target);
            } else {
                container.insertBefore(draggedCard, target.nextSibling);
            }
        }
    }

    // 清理拖拽状态函数
    function cleanupDragState() {
        if (draggedCard) {
            draggedCard.classList.remove('dragging');
            draggedCard.style.transform = '';
            draggedCard = null;
        }

        document.removeEventListener('touchmove', touchMove);
        document.removeEventListener('touchend', touchEnd);

        touchStartX = null;
        touchStartY = null;
    }

    // 保存卡片顺序
    async function saveCardOrder() {
        if (!await validateToken()) {
            return;
        }
        const containers = document.querySelectorAll('.card-container');
        let newPublicLinks = [];
        let newPrivateLinks = [];
        let newCategories = {};

        containers.forEach(container => {
            const category = container.id;
            newCategories[category] = [];

            [...container.children].forEach(card => {
                const url = card.getAttribute('data-url');
                const name = card.querySelector('.card-title').textContent;
                const isPrivate = card.dataset.isPrivate === 'true';
                card.dataset.category = category;

                // 从原始链接数据中获取描述和图标信息
                const originalLink = links.find(link => link.url === url);
                const tips = originalLink?.tips || '';
                const icon = originalLink?.icon || '';

                const link = { name, url, tips, icon, category, isPrivate };
                if (isPrivate) {
                    newPrivateLinks.push(link);
                } else {
                    newPublicLinks.push(link);
                }
                newCategories[category].push(link);
            });
        });

        publicLinks.length = 0;
        publicLinks.push(...newPublicLinks);
        privateLinks.length = 0;
        privateLinks.push(...newPrivateLinks);
        Object.keys(categories).forEach(key => delete categories[key]);
        Object.assign(categories, newCategories);

        try {
            const response = await fetch('/api/saveOrder', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': localStorage.getItem('authToken')
                },
                body: JSON.stringify({
                    userId: 'testUser',
                    links: [...newPublicLinks, ...newPrivateLinks],
                    categories: newCategories
                }),
            });
            const result = await response.json();
            if (!result.success) {
                throw new Error('Failed to save order');
            }
            logAction('保存卡片顺序', { publicCount: newPublicLinks.length, privateCount: newPrivateLinks.length, categoryCount: Object.keys(newCategories).length });
        } catch (error) {
            logAction('保存顺序失败', { error: error.message });
            await customAlert('保存顺序失败，请重试', '保存失败');
        }
    }

    // 更新链接
    async function updateLink(oldLink) {
        if (!await validateToken()) return;

        const name = document.getElementById('name-input').value.trim();
        const url = document.getElementById('url-input').value.trim();
        const tips = document.getElementById('tips-input').value.trim();
        const icon = document.getElementById('icon-input').value.trim();
        const category = document.getElementById('category-select').value;
        const isPrivate = document.getElementById('private-checkbox').checked;

        // 验证必填字段
        if (!name || !url || !category) {
            let errorMessage = '';
            if (!name && !url) {
                errorMessage = '请输入名称和URL';
            } else if (!name) {
                errorMessage = '请输入名称';
            } else if (!url) {
                errorMessage = '请输入URL';
            }

            await customAlert(errorMessage, '编辑卡片');
            if (!name) {
                document.getElementById('name-input').focus();
            } else if (!url) {
                document.getElementById('url-input').focus();
            }
            return;
        }

        // 规范化 URL 并检查是否与其他链接重复（排除当前编辑的链接）
        const normalizedUrl = normalizeUrl(url);
        const normalizedOldUrl = normalizeUrl(oldLink.url);
        const allLinks = [...publicLinks, ...privateLinks];

        // 预处理：一次性规范化所有 URL（性能优化）
        const normalizedUrls = allLinks.map(link => normalizeUrl(link.url));
        const isUrlExists = normalizedUrls.some(nUrl =>
            nUrl === normalizedUrl && nUrl !== normalizedOldUrl
        );

        if (isUrlExists) {
            await customAlert('该URL已存在，请勿重复添加', '编辑卡片');
            document.getElementById('url-input').focus();
            return;
        }

        // 存储规范化后的 URL
        const updatedLink = { name, url: normalizedUrl, tips, icon, category, isPrivate };

        try {
            // 替换旧链接
            const list = oldLink.isPrivate ? privateLinks : publicLinks;
            const listNormalizedUrls = list.map(l => normalizeUrl(l.url));
            const index = listNormalizedUrls.indexOf(normalizedOldUrl);
            if (index !== -1) {
                list[index] = updatedLink;
            }

            // 同步更新 links
            links = isLoggedIn ? [...publicLinks, ...privateLinks] : publicLinks;

            await saveLinks();
            renderSections();
            hideAddDialog();

            logAction('更新卡片', { oldUrl: oldLink.url, name, url, tips, icon, category, isPrivate });
        } catch (error) {
            logAction('更新卡片失败:', error);
            await customAlert('更新卡片失败:' + error.message, '编辑卡片');
        }
    }

    // 处理鼠标悬停提示
    function handleTooltipMouseMove(e, tips, isAdmin) {
        const tooltip = document.getElementById('custom-tooltip');

        if (!tips || isAdmin) {
            tooltip.style.display = 'none';
            return;
        }

        // 设置提示内容
        if (tooltip.textContent !== tips) {
            tooltip.textContent = tips;
        }

        tooltip.style.display = 'block';

        const offsetX = 15;
        const offsetY = 10;

        const tooltipRect = tooltip.getBoundingClientRect();
        const pageWidth = window.innerWidth;
        const pageHeight = window.innerHeight;

        let left = e.pageX + offsetX;
        let top = e.pageY + offsetY;

        if (pageWidth - e.clientX < 200) {
            left = e.pageX - tooltipRect.width - offsetX;
        }
        // 如果距离底部小于100像素，往上显示
        if (pageHeight - e.clientY < 100) {
            top = e.pageY - tooltipRect.height - offsetY;
        }

        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';
    }

    // 书签搜索功能 - 简化版
    function searchBookmarks(query) {
        if (!query || query.trim() === '') {
            hideSearchResults();
            return;
        }

        query = query.toLowerCase().trim();
        const sectionsContainer = document.getElementById('sections-container');

        // 只搜索书签名称，简化搜索逻辑
        const visibleLinks = links;
        const matchedLinks = visibleLinks.filter(link =>
            link.name.toLowerCase().includes(query)
        );

        // 清空主内容区域
        sectionsContainer.innerHTML = '';

        // 创建搜索结果头部
        const searchHeader = document.createElement('div');
        searchHeader.className = 'search-results-header';

        const searchTitle = document.createElement('div');
        searchTitle.className = 'search-results-title';
        searchTitle.textContent = '搜索结果 (' + matchedLinks.length + '个)';

        const backButton = document.createElement('button');
        backButton.className = 'back-to-main';
        backButton.textContent = '返回主页';
        backButton.onclick = hideSearchResults;

        searchHeader.appendChild(searchTitle);
        searchHeader.appendChild(backButton);
        sectionsContainer.appendChild(searchHeader);

        if (matchedLinks.length === 0) {
            const noResults = document.createElement('div');
            noResults.className = 'no-search-results';
            noResults.textContent = '没有找到匹配的书签';
            noResults.style.textAlign = 'center';
            noResults.style.padding = '40px';
            noResults.style.color = '#666';
            sectionsContainer.appendChild(noResults);
        } else {
            // 创建简单的搜索结果容器
            const resultsSection = document.createElement('div');
            resultsSection.className = 'search-results-section';

            const cardContainer = document.createElement('div');
            cardContainer.className = 'card-container';

            // 为每个匹配的链接创建卡片
            matchedLinks.forEach(link => {
                createCard(link, cardContainer);
            });

            resultsSection.appendChild(cardContainer);
            sectionsContainer.appendChild(resultsSection);
        }

        // 设置搜索状态标记
        isShowingSearchResults = true;

        // 隐藏分类按钮
        const categoryButtonsContainer = document.getElementById('category-buttons-container');
        if (categoryButtonsContainer) {
            categoryButtonsContainer.style.display = 'none';

        logAction('执行书签搜索', { query, resultCount: matchedLinks.length });
    }

    // 自定义Alert对话框
    function customAlert(message, title = '提示', confirmText = '确定') {
        return new Promise((resolve) => {
            const overlay = document.getElementById('custom-alert-overlay');
            const titleEl = document.getElementById('custom-alert-title');
            const contentEl = document.getElementById('custom-alert-content');
            const confirmBtn = document.getElementById('custom-alert-confirm');

            // 设置内容
            titleEl.textContent = title;
            contentEl.textContent = message;
            confirmBtn.textContent = confirmText;

            // 显示弹窗
            overlay.style.display = 'flex';

            // 确认按钮事件
            const handleConfirm = () => {
                overlay.style.display = 'none';
                confirmBtn.removeEventListener('click', handleConfirm);
                document.removeEventListener('keydown', handleKeyDown);
                resolve();
            };

            confirmBtn.addEventListener('click', handleConfirm);

            // ESC键关闭
            const handleKeyDown = (e) => {
                if (e.key === 'Escape') {
                    handleConfirm();
                }
            };

            document.addEventListener('keydown', handleKeyDown);

            // 点击遮罩层关闭
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    handleConfirm();
                }
            });
        });
    }

    // 自定义Confirm对话框
    function customConfirm(message, okText = '确定', cancelText = '取消') {
        return new Promise((resolve) => {
            const overlay = document.getElementById('custom-confirm-overlay');
            const messageEl = document.getElementById('custom-confirm-message');
            const okBtn = document.getElementById('custom-confirm-ok');
            const cancelBtn = document.getElementById('custom-confirm-cancel');

            // 设置弹窗内容
            messageEl.textContent = message;
            okBtn.textContent = okText;
            cancelBtn.textContent = cancelText;

            // 显示弹窗
            overlay.style.display = 'flex';

            // 事件处理函数
            const handleConfirm = (result) => {
                cleanup();
                resolve(result);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') handleConfirm(true);
                if (e.key === 'Escape') handleConfirm(false);
            };

            // 清理函数
            const cleanup = () => {
                overlay.style.display = 'none';
                document.removeEventListener('keydown', handleKeyDown);
                okBtn.onclick = null;
                cancelBtn.onclick = null;
                overlay.onclick = null;
            };

            // 绑定事件
            okBtn.onclick = () => handleConfirm(true);
            cancelBtn.onclick = () => handleConfirm(false);
            document.addEventListener('keydown', handleKeyDown);
            overlay.onclick = (e) => e.target === overlay && handleConfirm(false);
        });
    }

    // 分类名称输入对话框
    function showCategoryDialog(title, defaultValue = '') {
        return new Promise((resolve) => {
            const dialog = document.getElementById('category-dialog');
            const input = document.getElementById('category-name-input');
            const titleEl = document.getElementById('category-dialog-title');
            const confirmBtn = document.getElementById('category-confirm-btn');
            const cancelBtn = document.getElementById('category-cancel-btn');

            // 设置弹窗内容
            titleEl.textContent = title;
            input.value = defaultValue;

            // 显示弹窗
            dialog.style.display = 'flex';
            setTimeout(() => input.focus(), 50);

            // 事件处理函数
            const handleConfirm = () => {
                const value = input.value.trim();
                if (value) {
                    cleanup();
                    resolve(value);
                } else {
                    input.focus();
                }
            };

            const handleCancel = () => {
                cleanup();
                resolve(null);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleConfirm();
                } else if (e.key === 'Escape') {
                    handleCancel();
                }
            };

            // 清理函数
            const cleanup = () => {
                dialog.style.display = 'none';
                document.removeEventListener('keydown', handleKeyDown);
                confirmBtn.onclick = null;
                cancelBtn.onclick = null;
                dialog.onclick = null;
            };

            // 绑定事件
            confirmBtn.onclick = handleConfirm;
            cancelBtn.onclick = handleCancel;
            document.addEventListener('keydown', handleKeyDown);
            dialog.onclick = (e) => e.target === dialog && handleCancel();
        });
    }

    // 显示加载遮罩
    function showLoading(message = '加载中，请稍候...') {
        const mask = document.getElementById('loading-mask');
        const textElement = mask.querySelector('p');

        mask.style.display = 'flex';
    }

    // 隐藏加载遮罩
    function hideLoading() {
        const mask = document.getElementById('loading-mask');
        mask.style.display = 'none';
    }
